<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bot You Own</title>
<style>
  :root {
    --accent:#10a37f; --bg:#ffffff; --side:#f9f9f9; --panel:#f4f4f5; --text:#0d0d0d; --muted:#6b6b6b;
    --edge:#e5e5e5; --user:#f4f4f4; --code:#f6f6f6; --danger:#b42318; --chip:#eef2ff; --chipText:#3730a3;
  }
  [data-theme="dark"] {
    --bg:#212121; --side:#171717; --panel:#2f2f2f; --text:#ececec; --muted:#9a9a9a; --edge:#3a3a3a;
    --user:#2f2f2f; --code:#1a1a1a; --chip:#1f2937; --chipText:#c7d2fe;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#212121; --side:#171717; --panel:#2f2f2f; --text:#ececec; --muted:#9a9a9a; --edge:#3a3a3a;
      --user:#2f2f2f; --code:#1a1a1a; --chip:#1f2937; --chipText:#c7d2fe;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; }
  .app { display:grid; grid-template-columns:260px 1fr; height:100vh; }
  body.embed .app { grid-template-columns:1fr; }
  body.embed aside { display:none; }

  aside { background:var(--side); border-right:1px solid var(--edge); display:flex; flex-direction:column; overflow:hidden; }
  .brand { padding:14px 14px 8px; font-weight:650; font-size:15px; display:flex; align-items:center; justify-content:space-between; }
  .newchat { margin:6px 10px 10px; padding:9px 12px; border:1px solid var(--edge); background:var(--bg); color:var(--text); border-radius:10px; cursor:pointer; font-size:14px; text-align:left; }
  .newchat:hover { background:var(--panel); }
  .section { padding:10px 14px 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .list { overflow-y:auto; padding:0 8px; }
  .item { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--text); display:flex; flex-direction:column; gap:1px; }
  .item:hover { background:var(--panel); }
  .item.active { background:var(--panel); font-weight:600; }
  .item small { color:var(--muted); font-weight:400; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chats { flex:1; }
  .chat-row { display:flex; align-items:center; }
  .chat-row .item { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .chat-row button { border:0; background:transparent; color:var(--muted); cursor:pointer; padding:4px 6px; font-size:13px; }
  .chat-row button:hover { color:var(--danger); }
  .foot { padding:10px 14px; border-top:1px solid var(--edge); font-size:12px; color:var(--muted); line-height:1.4; }
  .foot b { color:var(--text); }

  main { display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--edge); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel); color:var(--muted); }
  .spacer { flex:1; }
  .iconbtn { border:1px solid var(--edge); background:var(--bg); color:var(--text); border-radius:8px; padding:4px 8px; cursor:pointer; font-size:13px; }
  #menu { display:none; }

  #scroll { flex:1; overflow-y:auto; }
  #log { max-width:760px; margin:0 auto; padding:24px 16px 12px; display:flex; flex-direction:column; gap:18px; }
  .empty { margin:auto; max-width:760px; padding:40px 16px; text-align:center; }
  .empty h2 { font-size:26px; font-weight:600; margin:0 0 6px; }
  .empty p { color:var(--muted); margin:0 0 22px; }
  .starters { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .starters button { text-align:left; padding:12px 14px; border:1px solid var(--edge); background:var(--bg); color:var(--text); border-radius:12px; cursor:pointer; font-size:14px; line-height:1.4; }
  .starters button:hover { background:var(--panel); }

  .msg { display:flex; gap:12px; }
  .msg.user { justify-content:flex-end; }
  .msg.user .body { background:var(--user); border-radius:18px; padding:10px 16px; max-width:80%; white-space:pre-wrap; }
  .msg.bot { flex-wrap:wrap; }
  .msg.bot .avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; margin-top:2px; }
  .msg.bot .body { min-width:0; flex:1; }
  .body p { margin:0 0 10px; } .body p:last-child { margin-bottom:0; }
  .body ul, .body ol { margin:0 0 10px; padding-left:22px; }
  .body h1, .body h2, .body h3 { font-size:16px; margin:12px 0 6px; }
  .body pre { background:var(--code); border:1px solid var(--edge); border-radius:10px; padding:12px; overflow-x:auto; font-size:13px; }
  .body code { background:var(--code); border-radius:4px; padding:1px 5px; font-size:13px; }
  .body pre code { background:none; padding:0; }
  .body a { color:var(--accent); }
  .cursor::after { content:"▍"; animation:blink 1s infinite; color:var(--muted); }
  .thinking { color:var(--muted); font-style:italic; }
  .thinking::after { content:"…"; }
  .thinking span { display:inline-block; animation:fadein .35s ease; }
  @keyframes fadein { from { opacity:0; transform:translateY(2px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .thinking span { animation:none; } }
  @keyframes blink { 50% { opacity:0; } }
  .flags { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0 40px; width:100%; }
  .flag { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--chipText); }
  .flag.hard { background:#fee2e2; color:#991b1b; }

  .composer { padding:10px 16px 8px; }
  .composer form { max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:8px; border:1px solid var(--edge); border-radius:22px; padding:8px 8px 8px 16px; background:var(--bg); box-shadow:0 2px 12px rgba(0,0,0,.06); }
  textarea { flex:1; border:0; background:transparent; color:var(--text); font:inherit; resize:none; max-height:180px; outline:none; padding:6px 0; }
  .send { width:36px; height:36px; border-radius:50%; border:0; background:var(--text); color:var(--bg); cursor:pointer; font-size:16px; flex:none; }
  .send.stop { background:var(--danger); color:#fff; }
  .disclaimer { text-align:center; font-size:11px; color:var(--muted); padding:6px 0 4px; }

  /* ---- the door ---- */
  .lockwrap { position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; padding:20px; }
  #adminlock { background:rgba(0,0,0,.35); z-index:60; }
  .lockwrap.show { display:flex; }
  .lockwrap form { width:min(380px,100%); border:1px solid var(--edge); border-radius:16px; padding:24px; background:var(--side); display:flex; flex-direction:column; gap:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .lockwrap h2 { margin:0; font-size:18px; } .lockwrap p { margin:0; color:var(--muted); font-size:13px; }
  .lockwrap input { padding:11px 12px; border:1px solid var(--edge); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  .lockwrap button { padding:10px; border:0; border-radius:10px; background:var(--text); color:var(--bg); font-weight:600; cursor:pointer; }
  .lockmsg, #lockmsg { color:var(--danger); min-height:18px; font-size:13px; }

  /* ---- under the hood ---- */
  #hood { position:fixed; top:0; right:0; bottom:0; width:min(680px,100%); background:var(--side); border-left:1px solid var(--edge); z-index:40; display:none; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,.15); }
  #hood.show { display:flex; }
  #hood header { border-bottom:1px solid var(--edge); }
  .tabs { display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--edge); flex-wrap:wrap; }
  .tabs button { border:1px solid transparent; background:transparent; color:var(--muted); padding:6px 10px; border-radius:8px; cursor:pointer; font-size:13px; }
  .tabs button.on { background:var(--bg); color:var(--text); border-color:var(--edge); }
  #hoodbody { flex:1; overflow:auto; padding:14px 16px; font-size:13px; }
  #hoodbody pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); border:1px solid var(--edge); border-radius:10px; padding:12px; margin:0 0 12px; font-size:12.5px; line-height:1.5; }
  #hoodbody h4 { margin:14px 0 6px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  #hoodbody .kv { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; }
  #hoodbody .kv b { font-weight:600; }
  #hoodbody select { font:inherit; padding:6px 8px; border:1px solid var(--edge); border-radius:8px; background:var(--bg); color:var(--text); margin-bottom:10px; }
  .tag-xml { color:var(--accent); font-weight:600; }
  .copy { float:right; font-size:11px; }

  @media (max-width: 760px) {
    .app { grid-template-columns:1fr; }
    aside { position:fixed; inset:0 30% 0 0; z-index:20; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.3); }
    aside.open { transform:none; }
    #menu { display:inline-block; }
    .starters { grid-template-columns:1fr; }
    .msg.user .body { max-width:92%; }
  }
</style>
</head>
<body>
<div id="adminlock" class="lockwrap"><form id="adminform">
  <h2>Admin code</h2>
  <p>Opens "Under the hood": the prompt, the files, the firewall rules and the source for this project.</p>
  <input id="adminpass" type="password" placeholder="Admin code" autocomplete="off" />
  <div style="display:flex;gap:8px"><button type="submit" style="flex:1">Open</button><button type="button" id="admincancel" style="flex:1;background:var(--panel);color:var(--text)">Cancel</button></div>
  <div id="adminmsg" class="lockmsg"></div>
</form></div>
<div id="lock" class="lockwrap"><form id="lockform">
  <h2 id="locktitle">This bot is locked</h2>
  <p>Enter the passphrase to continue.</p>
  <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" />
  <button type="submit">Unlock</button>
  <div id="lockmsg"></div>
</form></div>
<div class="app">
  <aside id="side">
    <div class="brand"><span id="brand">The Bot You Own</span><button class="iconbtn" id="theme" title="Toggle theme">◐</button></div>
    <button class="newchat" id="newchat">＋ New chat</button>
    <div class="section">Projects</div>
    <div class="list" id="projects"></div>
    <div class="section">Chats</div>
    <div class="list chats" id="chats"></div>
    <div class="foot" id="foot"></div>
  </aside>

  <main>
    <header>
      <button class="iconbtn" id="menu">☰</button>
      <h1 id="title">Assistant</h1>
      <span class="pill" id="modepill"></span>
      <span class="spacer"></span>
      <span class="pill" id="modelpill"></span>
      <button class="iconbtn" id="hoodbtn" title="Under the hood (admin)" hidden>⚙ Under the hood</button>
    </header>
    <aside id="hood">
      <header><h1>Under the hood</h1><span class="pill" id="hoodproj"></span><span class="spacer"></span><button class="iconbtn" id="hoodclose">✕</button></header>
      <div class="tabs" id="hoodtabs">
        <button data-tab="prompt" class="on">Prompt</button><button data-tab="files">Files</button><button data-tab="firewall">Firewall</button><button data-tab="gateway">Gateway &amp; model</button><button data-tab="source">Source</button>
      </div>
      <div id="hoodbody"></div>
    </aside>
    <div id="scroll">
      <div id="log"></div>
    </div>
    <div class="composer">
      <form id="form" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message…"></textarea>
        <button class="send" id="send" type="submit" title="Send">↑</button>
      </form>
      <div class="disclaimer" id="disclaimer">Can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<script>
// ============================================================================
//  The page. Plain JS, no framework, no build step.
//  Chats are stored in this browser only (localStorage). Nothing is sent
//  anywhere except /api/chat on this same domain.
// ============================================================================
const qs = new URLSearchParams(location.search);
const EMBED = qs.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');

const $ = (id) => document.getElementById(id);
const state = { cfg: null, projects: [], project: null, chat: null, busy: false, abort: null };

try { const t = localStorage.getItem('byo:theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
$('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('byo:theme', next); } catch {}
};
$('menu').onclick = () => $('side').classList.toggle('open');

const store = {
  key: (pid) => 'byo:chats:' + pid,
  list(pid) { try { return JSON.parse(localStorage.getItem(this.key(pid)) || '[]'); } catch { return []; } },
  save(pid, chats) { try { localStorage.setItem(this.key(pid), JSON.stringify(chats.slice(0, 50))); } catch {} },
  upsert(chat) { const all = this.list(chat.project).filter((c) => c.id !== chat.id); all.unshift(chat); this.save(chat.project, all); },
  remove(pid, id) { this.save(pid, this.list(pid).filter((c) => c.id !== id)); },
};

// ---- the door ----
let TOKEN = ''; try { TOKEN = localStorage.getItem('byo:token') || ''; } catch {}
const authHeaders = () => TOKEN ? { 'x-access-token': TOKEN } : {};
function showLock(msg) { $('lock').classList.add('show'); $('lockmsg').textContent = msg || ''; $('pass').focus(); }
$('lockform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/unlock', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ passphrase: $('pass').value }) });
  const data = await res.json().catch(() => ({}));
  if (res.ok && data.token) { TOKEN = data.token; try { localStorage.setItem('byo:token', TOKEN); } catch {} $('lock').classList.remove('show'); $('pass').value = ''; boot(); }
  else $('lockmsg').textContent = res.status === 429 ? 'Too many attempts. Wait a minute.' : 'Wrong passphrase.';
});

function boot() { fetch('/api/config', { headers: authHeaders() }).then((r) => r.json()).then((cfg) => {
  if (cfg.locked && !cfg.projects) { $('brand').textContent = cfg.siteName || 'The Bot You Own'; return showLock(TOKEN ? 'Your key expired. Enter the passphrase again.' : ''); }
  state.cfg = cfg; state.projects = cfg.projects;
  document.title = cfg.siteName || 'The Bot You Own';
  $('brand').textContent = cfg.siteName || 'The Bot You Own';
  if (cfg.accent) document.documentElement.style.setProperty('--accent', cfg.accent);
  $('modelpill').textContent = (cfg.model || '').replace(/^@cf\//, '');
  $('hoodbtn').hidden = !cfg.adminEnabled;
  const v = cfg.version || {}; const built = v.builtAt ? new Date(v.builtAt).toISOString().slice(0, 16).replace('T', ' ') + ' UTC' : '';
  $('foot').innerHTML = 'Run by <b>' + esc(cfg.owner || '') + '</b><br>' + esc(cfg.provider || '') + ' · your account, your bill<br><span title="' + esc(built) + '">v' + esc(v.version || '?') + (v.commit ? ' · ' + esc(v.commit) : '') + (built ? ' · ' + esc(built) : '') + '</span>';
  const want = qs.get('project') || cfg.defaultProject;
  selectProject(state.projects.find((p) => p.id === want) || state.projects[0]);
  const wantChat = qs.get('chat'); if (wantChat) { const c = store.list(state.project.id).find((x) => x.id === wantChat); if (c) loadChat(c, true); }
}).catch(() => { $('log').innerHTML = '<p style="color:var(--muted)">Could not load /api/config.</p>'; }); }
boot();

// ---- history: every project or chat switch is a Back-able step ----
function pushUrl(replace) {
  const u = new URL(location.href);
  u.searchParams.set('project', state.project.id);
  if (state.chat?.messages?.length) u.searchParams.set('chat', state.chat.id); else u.searchParams.delete('chat');
  const st = { project: state.project.id, chat: state.chat?.id || null };
  try { replace ? history.replaceState(st, '', u) : history.pushState(st, '', u); } catch {}
}
window.addEventListener('popstate', (e) => {
  const st = e.state || {}; const pid = st.project || new URLSearchParams(location.search).get('project');
  const p = state.projects.find((x) => x.id === pid) || state.projects[0];
  if (!p) return;
  selectProject(p, true);
  if (st.chat) { const c = store.list(p.id).find((x) => x.id === st.chat); if (c) loadChat(c, true); }
});

function selectProject(p, silent) {
  state.project = p;
  $('title').textContent = p.name;
  $('modepill').textContent = p.mode + ' · ' + (p.grounding === 'open' ? 'open' : 'files only');
  $('disclaimer').textContent = p.grounding === 'open'
    ? 'Can make mistakes. Check important information.'
    : 'Answers only from what ' + p.name + ' has written down. Can still make mistakes.';
  renderProjects(); newChat(silent);
  if ($('hood').classList.contains('show')) openHood();
}

function renderProjects() {
  $('projects').innerHTML = '';
  state.projects.forEach((p) => {
    const el = document.createElement('div');
    el.className = 'item' + (p.id === state.project?.id ? ' active' : '');
    el.innerHTML = '<span>' + esc(p.name) + '</span><small>' + esc(p.tagline || '') + '</small>';
    el.onclick = () => { selectProject(p); $('side').classList.remove('open'); };
    $('projects').appendChild(el);
  });
}

function renderChats() {
  const box = $('chats'); box.innerHTML = '';
  store.list(state.project.id).forEach((c) => {
    const row = document.createElement('div'); row.className = 'chat-row';
    const el = document.createElement('div');
    el.className = 'item' + (c.id === state.chat?.id ? ' active' : '');
    el.textContent = c.title || 'New chat';
    el.onclick = () => { loadChat(c); $('side').classList.remove('open'); };
    const del = document.createElement('button'); del.textContent = '✕'; del.title = 'Delete';
    del.onclick = (e) => { e.stopPropagation(); store.remove(state.project.id, c.id); if (state.chat?.id === c.id) newChat(); else renderChats(); };
    row.append(el, del); box.appendChild(row);
  });
}

function newChat(silent) {
  state.chat = { id: Date.now().toString(36), project: state.project.id, title: '', messages: [] };
  renderChats(); renderLog(); $('input').focus();
  if (!silent) pushUrl(!history.state);           // first load replaces, later switches push
}
$('newchat').onclick = () => newChat();
function loadChat(c, silent) { state.chat = c; renderChats(); renderLog(); if (!silent) pushUrl(); }

function renderLog() {
  const log = $('log'); log.innerHTML = '';
  if (!state.chat.messages.length) {
    const p = state.project;
    const empty = document.createElement('div'); empty.className = 'empty';
    empty.innerHTML = '<h2>' + esc(p.greeting || 'What can I help with?') + '</h2><p>' + esc(p.tagline || '') + '</p>';
    if (p.starters?.length) {
      const grid = document.createElement('div'); grid.className = 'starters';
      p.starters.forEach((s) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.onclick = () => send(s); grid.appendChild(b); });
      empty.appendChild(grid);
    }
    log.appendChild(empty); return;
  }
  state.chat.messages.forEach((m) => addMessage(m.role, m.content, m.flags));
  scrollDown();
}

function addMessage(role, content, flags) {
  const el = document.createElement('div'); el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const body = document.createElement('div'); body.className = 'body';
  if (role === 'user') body.textContent = content;
  else { el.innerHTML = '<div class="avatar">' + esc((state.project?.name || 'A')[0]) + '</div>'; body.innerHTML = md(content); }
  el.appendChild(body);
  if (flags?.length) el.appendChild(flagRow(flags));
  $('log').appendChild(el); return body;
}

const FLAG_LABELS = {
  'injection-blocked': '🛡 blocked before the model', 'link-stripped': '🔗 link removed', 'leak-blocked': '🛡 answer withheld: it quoted the rules',
  'rate-limited': '⏱ rate limited', 'model-error': '⚠ model error', 'gateway-blocked': '🛡 blocked at the gateway',
  'invisible-text-stripped': '👁 hidden characters removed', 'handoff-appended': '📇 contact added by the firewall', 'secret-detected': '🔑 looks like a secret was pasted',
};
function flagRow(flags) {
  const row = document.createElement('div'); row.className = 'flags';
  flags.forEach((f) => {
    const c = document.createElement('span'); c.className = 'flag' + (/blocked|error/.test(f) ? ' hard' : '');
    c.textContent = FLAG_LABELS[f] || f; row.appendChild(c);
  });
  return row;
}
function scrollDown() { const s = $('scroll'); s.scrollTop = s.scrollHeight; }

const form = $('form'), input = $('input'), sendBtn = $('send');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
form.addEventListener('submit', (e) => { e.preventDefault(); if (state.busy) { state.abort?.abort(); return; } send(input.value.trim()); });

async function send(text) {
  if (!text || state.busy) return;
  input.value = ''; input.style.height = 'auto';
  const chat = state.chat;
  if (!chat.messages.length) { $('log').innerHTML = ''; chat.title = text.slice(0, 40); pushUrl(true); }
  chat.messages.push({ role: 'user', content: text });
  addMessage('user', text);
  const body = addMessage('assistant', '');
  // "Thinking…" — rotates through the project's words (or the global list) until the first token lands.
  const words = (state.project.thinkingWords || state.cfg.thinkingWords || ['Thinking']).slice();
  let wi = Math.floor(Math.random() * words.length);
  const showWord = () => { body.className = 'body thinking'; body.innerHTML = '<span>' + esc(words[wi]) + '</span>'; wi = (wi + 1) % words.length; };
  showWord();
  const ticker = words.length > 1 ? setInterval(showWord, 1400) : null;
  const stopThinking = () => { if (ticker) clearInterval(ticker); body.className = 'body cursor'; };
  scrollDown();

  state.busy = true; sendBtn.classList.add('stop'); sendBtn.textContent = '■'; sendBtn.title = 'Stop';
  state.abort = new AbortController();
  let full = '', finalText = null, flags = [];
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() }, signal: state.abort.signal,
      body: JSON.stringify({ project: state.project.id, messages: chat.messages.map(({ role, content }) => ({ role, content })), stream: true }),
    });
    if (res.status === 401) { TOKEN = ''; try { localStorage.removeItem('byo:token'); } catch {} showLock('Enter the passphrase to continue.'); }
    if (!(res.headers.get('content-type') || '').includes('event-stream')) {
      const data = await res.json().catch(() => ({}));
      finalText = data.reply || data.error || 'Sorry — something went wrong on our end.'; flags = data.flags || [];
    } else {
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
      while (true) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n\n')) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
          if (!line.startsWith('data:')) continue;
          const ev = JSON.parse(line.slice(5));
          if (ev.type === 'delta') { if (!full) stopThinking(); full += ev.text; body.innerHTML = md(full); scrollDown(); }
          if (ev.type === 'final') { finalText = ev.text; flags = ev.flags || []; }
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') finalText = full || '(stopped)'; else finalText = 'Sorry — something went wrong on our end.';
  }
  stopThinking(); body.classList.remove('cursor');
  const reply = finalText ?? full;
  body.innerHTML = md(reply);
  if (flags.length) body.parentElement.appendChild(flagRow(flags));
  chat.messages.push({ role: 'assistant', content: reply, flags });
  store.upsert(chat); renderChats();
  state.busy = false; sendBtn.classList.remove('stop'); sendBtn.textContent = '↑'; sendBtn.title = 'Send';
  scrollDown(); input.focus();
}

// ---- under the hood (admin) ----
let ADMIN = ''; try { ADMIN = localStorage.getItem('byo:admin') || ''; } catch {}
let hoodData = null, hoodTab = 'prompt';
$('hoodbtn').onclick = () => { if (ADMIN) return openHood(); $('adminlock').classList.add('show'); $('adminmsg').textContent = ''; $('adminpass').value = ''; $('adminpass').focus(); };
$('admincancel').onclick = () => $('adminlock').classList.remove('show');
$('adminform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('adminform').querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…'; $('adminmsg').textContent = '';
  try {
    const r = await fetch('/api/admin/unlock', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ passphrase: $('adminpass').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.token) { $('adminmsg').textContent = r.status === 429 ? 'Too many attempts. Wait a minute.' : 'Wrong admin code.'; return; }
    ADMIN = d.token; try { localStorage.setItem('byo:admin', ADMIN); } catch {}
    $('adminlock').classList.remove('show'); openHood();
  } catch { $('adminmsg').textContent = 'Could not reach the server. Try again.'; }
  finally { btn.disabled = false; btn.textContent = 'Open'; }
});
$('hoodclose').onclick = () => $('hood').classList.remove('show');
$('hoodtabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; hoodTab = b.dataset.tab; renderHood(); };
let hoodTicker = null;
function hoodLoading(what) {
  // Open the drawer at once and say what's happening; the engine view is a server round-trip.
  const words = ['Opening the engine', 'Building the prompt', 'Reading the files', 'Collecting the firewall rules'];
  let i = 0; const box = $('hoodbody');
  const tick = () => { box.innerHTML = '<p class="thinking" style="padding:8px 0"><span>' + esc(words[i % words.length]) + '</span></p><p style="color:var(--muted)">' + esc(what || '') + '</p>'; i++; };
  clearInterval(hoodTicker); tick(); hoodTicker = setInterval(tick, 1200);
  $('hoodproj').textContent = state.project.name; $('hood').classList.add('show');
}
async function openHood() {
  const btn = $('hoodbtn'); btn.disabled = true; btn.textContent = '⚙ Opening…';
  hoodLoading('Fetching the exact prompt, files and rules for ' + state.project.name + ' from the server.');
  try {
    const r = await fetch('/api/admin/engine?project=' + encodeURIComponent(state.project.id), { headers: { 'x-admin-token': ADMIN } });
    if (r.status === 401) { ADMIN = ''; try { localStorage.removeItem('byo:admin'); } catch {} clearInterval(hoodTicker); $('hood').classList.remove('show'); return $('hoodbtn').click(); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    hoodData = await r.json(); clearInterval(hoodTicker); renderHood();
  } catch (err) {
    clearInterval(hoodTicker);
    $('hoodbody').innerHTML = '<p style="color:var(--danger)">Could not load the engine view (' + esc(err.message) + '). Close and try again.</p>';
  } finally { btn.disabled = false; btn.textContent = '⚙ Under the hood'; }
}
function renderHood() {
  const d = hoodData; if (!d) return;
  [...$('hoodtabs').children].forEach((b) => b.classList.toggle('on', b.dataset.tab === hoodTab));
  const box = $('hoodbody'); const pre = (t) => '<pre>' + esc(t).replace(/&lt;(\/?[a-z_]+)&gt;/g, '<span class="tag-xml">&lt;$1&gt;</span>') + '</pre>';
  if (hoodTab === 'prompt') box.innerHTML = '<h4>The exact system prompt sent to the model for this project · ' + d.promptChars + ' chars ≈ ' + d.promptTokensApprox + ' tokens</h4>' + pre(d.prompt) + '<h4>Job (mode: ' + esc(d.project.mode) + ')</h4><div class="kv"><b>Role</b><span>' + esc(d.mode.role) + '</span><b>Done when</b><span>' + esc(d.mode.done) + '</span></div>';
  if (hoodTab === 'files') box.innerHTML = '<h4>instructions.md</h4>' + pre(d.project.instructions || '(none)') + Object.entries(d.files || {}).map(([n, t]) => '<h4>knowledge/' + esc(n) + ' · ' + t.length + ' chars</h4>' + pre(t)).join('') + '<h4>project.json</h4>' + pre(JSON.stringify({ ...d.project, instructions: undefined }, null, 2));
  if (hoodTab === 'firewall') { const f = d.firewall; box.innerHTML = '<h4>Switches (config.js → firewall)</h4>' + pre(JSON.stringify(f.config, null, 2)) + '<div class="kv"><b>Door</b><span>' + esc(f.door) + '</span><b>Rate limit</b><span>' + esc(f.rateLimit) + '</span><b>Logging</b><span>' + esc(f.logging) + '</span><b>Llama Guard model</b><span>' + esc(f.llamaGuardModel) + '</span></div><h4>Injection patterns (' + f.injectionPatterns.length + ') — a hit never reaches the model</h4>' + pre(f.injectionPatterns.join('\n')) + '<h4>Secret shapes</h4>' + pre(f.secretPatterns.join('\n')) + '<h4>What the chips mean</h4><div class="kv">' + Object.entries(f.flags).map(([k, v]) => '<b>' + esc(k) + '</b><span>' + esc(v) + '</span>').join('') + '</div>'; }
  if (hoodTab === 'gateway') box.innerHTML = '<h4>Version</h4>' + pre(JSON.stringify(d.version, null, 2)) + '<h4>Provider &amp; model</h4>' + pre(JSON.stringify(d.gateway, null, 2)) + '<p style="color:var(--muted)">gateway.id empty = calls go straight to the model. Set it to route through Cloudflare AI Gateway: spend cap, logs, caching, edge Guardrails. See DEPLOY.md.</p>';
  if (hoodTab === 'source') { box.innerHTML = '<h4>Engine source (snapshot taken at deploy)</h4><select id="srcsel">' + (d.sources || []).map((n) => '<option>' + esc(n) + '</option>').join('') + '</select><div id="srcbox"></div>'; const load = async () => { const n = $('srcsel').value; $('srcbox').innerHTML = '<p class="thinking"><span>Loading ' + esc(n) + '</span></p>'; try { const t = await (await fetch('/api/admin/source?name=' + encodeURIComponent(n), { headers: { 'x-admin-token': ADMIN } })).text(); $('srcbox').innerHTML = pre(t); } catch { $('srcbox').innerHTML = '<p style="color:var(--danger)">Could not load ' + esc(n) + '.</p>'; } }; $('srcsel').onchange = load; load(); }
}

// Tiny markdown. Everything is HTML-escaped FIRST, so nothing the model writes can run.
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function md(src) {
  let s = esc(src);
  const blocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => { blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>'); return '@@BLOCK' + (blocks.length - 1) + '@@'; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, '$1<i>$2</i>');
  s = s.replace(/\bhttps?:\/\/[^\s<)]+/g, (u) => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
  const lines = s.split('\n'); const out = []; let list = null;
  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd(); let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { closeList(); out.push('<h' + m[1].length + '>' + m[2] + '</h' + m[1].length + '>'); }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + m[1] + '</li>'); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + m[1] + '</li>'); }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); out.push('<p>' + line + '</p>'); }
  }
  closeList();
  return out.join('\n').replace(/<p>@@BLOCK(\d+)@@<\/p>|@@BLOCK(\d+)@@/g, (_, a, b) => blocks[a ?? b]);
}
