<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bot You Own</title>
<style>
  :root {
    --accent:#10a37f; --bg:#ffffff; --side:#f9f9f9; --panel:#f4f4f5; --text:#0d0d0d; --muted:#6b6b6b;
    --edge:#e5e5e5; --user:#f4f4f4; --code:#f6f6f6; --danger:#b42318; --chip:#eef2ff; --chipText:#3730a3;
  }
  [data-theme="dark"] {
    --bg:#212121; --side:#171717; --panel:#2f2f2f; --text:#ececec; --muted:#9a9a9a; --edge:#3a3a3a;
    --user:#2f2f2f; --code:#1a1a1a; --chip:#1f2937; --chipText:#c7d2fe;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#212121; --side:#171717; --panel:#2f2f2f; --text:#ececec; --muted:#9a9a9a; --edge:#3a3a3a;
      --user:#2f2f2f; --code:#1a1a1a; --chip:#1f2937; --chipText:#c7d2fe;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; }
  .app { display:grid; grid-template-columns:260px 1fr; height:100vh; }
  body.embed .app { grid-template-columns:1fr; }
  body.embed aside { display:none; }

  aside { background:var(--side); border-right:1px solid var(--edge); display:flex; flex-direction:column; overflow:hidden; }
  .brand { padding:14px 14px 8px; font-weight:650; font-size:15px; display:flex; align-items:center; justify-content:space-between; }
  .newchat { margin:6px 10px 10px; padding:9px 12px; border:1px solid var(--edge); background:var(--bg); color:var(--text); border-radius:10px; cursor:pointer; font-size:14px; text-align:left; }
  .newchat:hover { background:var(--panel); }
  .section { padding:10px 14px 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .list { overflow-y:auto; padding:0 8px; }
  .item { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--text); display:flex; flex-direction:column; gap:1px; }
  .item:hover { background:var(--panel); }
  .item.active { background:var(--panel); font-weight:600; }
  .item small { color:var(--muted); font-weight:400; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chats { flex:1; }
  .chat-row { display:flex; align-items:center; }
  .chat-row .item { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .chat-row button { border:0; background:transparent; color:var(--muted); cursor:pointer; padding:4px 6px; font-size:13px; }
  .chat-row button:hover { color:var(--danger); }
  .foot { padding:10px 14px; border-top:1px solid var(--edge); font-size:12px; color:var(--muted); line-height:1.4; }
  .foot b { color:var(--text); }

  main { display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--edge); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel); color:var(--muted); }
  .spacer { flex:1; }
  .iconbtn { border:1px solid var(--edge); background:var(--bg); color:var(--text); border-radius:8px; padding:4px 8px; cursor:pointer; font-size:13px; }
  #menu { display:none; }

  #scroll { flex:1; overflow-y:auto; }
  #log { max-width:760px; margin:0 auto; padding:24px 16px 12px; display:flex; flex-direction:column; gap:18px; }
  .empty { margin:auto; max-width:760px; padding:40px 16px; text-align:center; }
  .empty h2 { font-size:26px; font-weight:600; margin:0 0 6px; }
  .empty p { color:var(--muted); margin:0 0 22px; }
  .starters { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .starters button { text-align:left; padding:12px 14px; border:1px solid var(--edge); background:var(--bg); color:var(--text); border-radius:12px; cursor:pointer; font-size:14px; line-height:1.4; }
  .starters button:hover { background:var(--panel); }

  .msg { display:flex; gap:12px; }
  .msg.user { justify-content:flex-end; }
  .msg.user .body { background:var(--user); border-radius:18px; padding:10px 16px; max-width:80%; white-space:pre-wrap; }
  .msg.bot { flex-wrap:wrap; }
  .msg.bot .avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; margin-top:2px; }
  .msg.bot .body { min-width:0; flex:1; }
  .body p { margin:0 0 10px; } .body p:last-child { margin-bottom:0; }
  .body ul, .body ol { margin:0 0 10px; padding-left:22px; }
  .body h1, .body h2, .body h3 { font-size:16px; margin:12px 0 6px; }
  .body pre { background:var(--code); border:1px solid var(--edge); border-radius:10px; padding:12px; overflow-x:auto; font-size:13px; }
  .body code { background:var(--code); border-radius:4px; padding:1px 5px; font-size:13px; }
  .body pre code { background:none; padding:0; }
  .body a { color:var(--accent); }
  .cursor::after { content:"▍"; animation:blink 1s infinite; color:var(--muted); }
  @keyframes blink { 50% { opacity:0; } }
  .flags { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0 40px; width:100%; }
  .flag { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--chipText); }
  .flag.hard { background:#fee2e2; color:#991b1b; }

  .composer { padding:10px 16px 8px; }
  .composer form { max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:8px; border:1px solid var(--edge); border-radius:22px; padding:8px 8px 8px 16px; background:var(--bg); box-shadow:0 2px 12px rgba(0,0,0,.06); }
  textarea { flex:1; border:0; background:transparent; color:var(--text); font:inherit; resize:none; max-height:180px; outline:none; padding:6px 0; }
  .send { width:36px; height:36px; border-radius:50%; border:0; background:var(--text); color:var(--bg); cursor:pointer; font-size:16px; flex:none; }
  .send.stop { background:var(--danger); color:#fff; }
  .disclaimer { text-align:center; font-size:11px; color:var(--muted); padding:6px 0 4px; }

  @media (max-width: 760px) {
    .app { grid-template-columns:1fr; }
    aside { position:fixed; inset:0 30% 0 0; z-index:20; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.3); }
    aside.open { transform:none; }
    #menu { display:inline-block; }
    .starters { grid-template-columns:1fr; }
    .msg.user .body { max-width:92%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span id="brand">The Bot You Own</span><button class="iconbtn" id="theme" title="Toggle theme">◐</button></div>
    <button class="newchat" id="newchat">＋ New chat</button>
    <div class="section">Projects</div>
    <div class="list" id="projects"></div>
    <div class="section">Chats</div>
    <div class="list chats" id="chats"></div>
    <div class="foot" id="foot"></div>
  </aside>

  <main>
    <header>
      <button class="iconbtn" id="menu">☰</button>
      <h1 id="title">Assistant</h1>
      <span class="pill" id="modepill"></span>
      <span class="spacer"></span>
      <span class="pill" id="modelpill"></span>
    </header>
    <div id="scroll">
      <div id="log"></div>
    </div>
    <div class="composer">
      <form id="form" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message…"></textarea>
        <button class="send" id="send" type="submit" title="Send">↑</button>
      </form>
      <div class="disclaimer" id="disclaimer">Can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<script>
// ============================================================================
//  The page. Plain JS, no framework, no build step.
//  Chats are stored in this browser only (localStorage). Nothing is sent
//  anywhere except /api/chat on this same domain.
// ============================================================================
const qs = new URLSearchParams(location.search);
const EMBED = qs.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');

const $ = (id) => document.getElementById(id);
const state = { cfg: null, projects: [], project: null, chat: null, busy: false, abort: null };

try { const t = localStorage.getItem('byo:theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
$('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('byo:theme', next); } catch {}
};
$('menu').onclick = () => $('side').classList.toggle('open');

const store = {
  key: (pid) => 'byo:chats:' + pid,
  list(pid) { try { return JSON.parse(localStorage.getItem(this.key(pid)) || '[]'); } catch { return []; } },
  save(pid, chats) { try { localStorage.setItem(this.key(pid), JSON.stringify(chats.slice(0, 50))); } catch {} },
  upsert(chat) { const all = this.list(chat.project).filter((c) => c.id !== chat.id); all.unshift(chat); this.save(chat.project, all); },
  remove(pid, id) { this.save(pid, this.list(pid).filter((c) => c.id !== id)); },
};

fetch('/api/config').then((r) => r.json()).then((cfg) => {
  state.cfg = cfg; state.projects = cfg.projects;
  document.title = cfg.siteName || 'The Bot You Own';
  $('brand').textContent = cfg.siteName || 'The Bot You Own';
  if (cfg.accent) document.documentElement.style.setProperty('--accent', cfg.accent);
  $('modelpill').textContent = (cfg.model || '').replace(/^@cf\//, '');
  $('foot').innerHTML = 'Run by <b>' + esc(cfg.owner || '') + '</b><br>' + esc(cfg.provider || '') + ' · your account, your bill';
  const want = qs.get('project') || cfg.defaultProject;
  selectProject(state.projects.find((p) => p.id === want) || state.projects[0]);
}).catch(() => { $('log').innerHTML = '<p style="color:var(--muted)">Could not load /api/config.</p>'; });

function selectProject(p) {
  state.project = p;
  $('title').textContent = p.name;
  $('modepill').textContent = p.mode + ' · ' + (p.grounding === 'open' ? 'open' : 'files only');
  $('disclaimer').textContent = p.grounding === 'open'
    ? 'Can make mistakes. Check important information.'
    : 'Answers only from what ' + p.name + ' has written down. Can still make mistakes.';
  renderProjects(); newChat();
}

function renderProjects() {
  $('projects').innerHTML = '';
  state.projects.forEach((p) => {
    const el = document.createElement('div');
    el.className = 'item' + (p.id === state.project?.id ? ' active' : '');
    el.innerHTML = '<span>' + esc(p.name) + '</span><small>' + esc(p.tagline || '') + '</small>';
    el.onclick = () => { selectProject(p); $('side').classList.remove('open'); };
    $('projects').appendChild(el);
  });
}

function renderChats() {
  const box = $('chats'); box.innerHTML = '';
  store.list(state.project.id).forEach((c) => {
    const row = document.createElement('div'); row.className = 'chat-row';
    const el = document.createElement('div');
    el.className = 'item' + (c.id === state.chat?.id ? ' active' : '');
    el.textContent = c.title || 'New chat';
    el.onclick = () => { loadChat(c); $('side').classList.remove('open'); };
    const del = document.createElement('button'); del.textContent = '✕'; del.title = 'Delete';
    del.onclick = (e) => { e.stopPropagation(); store.remove(state.project.id, c.id); if (state.chat?.id === c.id) newChat(); else renderChats(); };
    row.append(el, del); box.appendChild(row);
  });
}

function newChat() {
  state.chat = { id: Date.now().toString(36), project: state.project.id, title: '', messages: [] };
  renderChats(); renderLog(); $('input').focus();
}
$('newchat').onclick = newChat;
function loadChat(c) { state.chat = c; renderChats(); renderLog(); }

function renderLog() {
  const log = $('log'); log.innerHTML = '';
  if (!state.chat.messages.length) {
    const p = state.project;
    const empty = document.createElement('div'); empty.className = 'empty';
    empty.innerHTML = '<h2>' + esc(p.greeting || 'What can I help with?') + '</h2><p>' + esc(p.tagline || '') + '</p>';
    if (p.starters?.length) {
      const grid = document.createElement('div'); grid.className = 'starters';
      p.starters.forEach((s) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.onclick = () => send(s); grid.appendChild(b); });
      empty.appendChild(grid);
    }
    log.appendChild(empty); return;
  }
  state.chat.messages.forEach((m) => addMessage(m.role, m.content, m.flags));
  scrollDown();
}

function addMessage(role, content, flags) {
  const el = document.createElement('div'); el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const body = document.createElement('div'); body.className = 'body';
  if (role === 'user') body.textContent = content;
  else { el.innerHTML = '<div class="avatar">' + esc((state.project?.name || 'A')[0]) + '</div>'; body.innerHTML = md(content); }
  el.appendChild(body);
  if (flags?.length) el.appendChild(flagRow(flags));
  $('log').appendChild(el); return body;
}

const FLAG_LABELS = {
  'injection-blocked': '🛡 blocked before the model', 'link-stripped': '🔗 link removed', 'leak-blocked': '🛡 answer withheld: it quoted the rules',
  'rate-limited': '⏱ rate limited', 'model-error': '⚠ model error', 'gateway-blocked': '🛡 blocked at the gateway',
  'invisible-text-stripped': '👁 hidden characters removed', 'secret-detected': '🔑 looks like a secret was pasted',
};
function flagRow(flags) {
  const row = document.createElement('div'); row.className = 'flags';
  flags.forEach((f) => {
    const c = document.createElement('span'); c.className = 'flag' + (/blocked|error/.test(f) ? ' hard' : '');
    c.textContent = FLAG_LABELS[f] || f; row.appendChild(c);
  });
  return row;
}
function scrollDown() { const s = $('scroll'); s.scrollTop = s.scrollHeight; }

const form = $('form'), input = $('input'), sendBtn = $('send');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
form.addEventListener('submit', (e) => { e.preventDefault(); if (state.busy) { state.abort?.abort(); return; } send(input.value.trim()); });

async function send(text) {
  if (!text || state.busy) return;
  input.value = ''; input.style.height = 'auto';
  const chat = state.chat;
  if (!chat.messages.length) { $('log').innerHTML = ''; chat.title = text.slice(0, 40); }
  chat.messages.push({ role: 'user', content: text });
  addMessage('user', text);
  const body = addMessage('assistant', ''); body.classList.add('cursor');
  scrollDown();

  state.busy = true; sendBtn.classList.add('stop'); sendBtn.textContent = '■'; sendBtn.title = 'Stop';
  state.abort = new AbortController();
  let full = '', finalText = null, flags = [];
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' }, signal: state.abort.signal,
      body: JSON.stringify({ project: state.project.id, messages: chat.messages.map(({ role, content }) => ({ role, content })), stream: true }),
    });
    if (!(res.headers.get('content-type') || '').includes('event-stream')) {
      const data = await res.json().catch(() => ({}));
      finalText = data.reply || data.error || 'Sorry — something went wrong on our end.'; flags = data.flags || [];
    } else {
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
      while (true) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n\n')) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
          if (!line.startsWith('data:')) continue;
          const ev = JSON.parse(line.slice(5));
          if (ev.type === 'delta') { full += ev.text; body.innerHTML = md(full); scrollDown(); }
          if (ev.type === 'final') { finalText = ev.text; flags = ev.flags || []; }
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') finalText = full || '(stopped)'; else finalText = 'Sorry — something went wrong on our end.';
  }
  body.classList.remove('cursor');
  const reply = finalText ?? full;
  body.innerHTML = md(reply);
  if (flags.length) body.parentElement.appendChild(flagRow(flags));
  chat.messages.push({ role: 'assistant', content: reply, flags });
  store.upsert(chat); renderChats();
  state.busy = false; sendBtn.classList.remove('stop'); sendBtn.textContent = '↑'; sendBtn.title = 'Send';
  scrollDown(); input.focus();
}

// Tiny markdown. Everything is HTML-escaped FIRST, so nothing the model writes can run.
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function md(src) {
  let s = esc(src);
  const blocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => { blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>'); return '@@BLOCK' + (blocks.length - 1) + '@@'; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, '$1<i>$2</i>');
  s = s.replace(/\bhttps?:\/\/[^\s<)]+/g, (u) => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
  const lines = s.split('\n'); const out = []; let list = null;
  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd(); let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { closeList(); out.push('<h' + m[1].length + '>' + m[2] + '</h' + m[1].length + '>'); }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + m[1] + '</li>'); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + m[1] + '</li>'); }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); out.push('<p>' + line + '</p>'); }
  }
  closeList();
  return out.join('\n').replace(/<p>@@BLOCK(\d+)@@<\/p>|@@BLOCK(\d+)@@/g, (_, a, b) => blocks[a ?? b]);
}
</script>
</body>
</html>
